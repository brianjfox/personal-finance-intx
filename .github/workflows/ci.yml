# CI (WINDOWS_PORT §5): the full suite on both desktop platforms, and a
# Windows NSIS installer built where Tauri can actually bundle it. The
# win32-gated live secret-store suite (packages/institutions/test/
# secrets-windows-live.test.ts) only ever executes on the windows runner.
name: ci

on:
  push:
    branches: [main, ci/windows-build]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: GUI build
        working-directory: apps/desktop
        run: bun run build

  windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: bun install --frozen-lockfile
      - name: GUI build
        working-directory: apps/desktop
        run: bun run build
      - name: Compile fin-host sidecar (bun-windows-x64)
        working-directory: apps/host
        run: |
          mkdir -p ../desktop/src-tauri/binaries
          bun build --compile --target=bun-windows-x64 src/cli.ts --outfile ../desktop/src-tauri/binaries/fin-host-x86_64-pc-windows-msvc.exe
      # NSIS only: the config's ["app", "dmg"] targets are the macOS
      # build; --bundles overrides per-run without touching them.
      # Unsigned per DECISIONS.md D-038 (SmartScreen will warn).
      - name: Tauri build (NSIS)
        working-directory: apps/desktop
        run: bunx @tauri-apps/cli@^2 build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

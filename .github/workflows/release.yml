# Release (docs/RELEASING.md): a vX.Y.Z tag (pushed by scripts/release.sh)
# runs the full suite on both desktop platforms, builds every artifact,
# and opens a DRAFT GitHub release carrying docs/releases/X.Y.Z.md as its
# notes. Publishing the draft is a deliberate click after review.
#
# Artifacts — only what an installer needs:
#   Corbits-Personal-Finance-X.Y.Z-macOS-universal.dmg   arm64 + x86_64 app
#   Corbits-Personal-Finance-X.Y.Z-Windows-x64-setup.exe NSIS installer
#   SHA256SUMS.txt                                       to verify the two above
# (The standalone fin-host CLI ships inside both; it is not a separate download.)
#
# macOS signing is opt-in through repository secrets (APPLE_CERTIFICATE,
# APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID,
# APPLE_PASSWORD, APPLE_TEAM_ID); without them the .dmg is ad-hoc signed
# and the draft says so. The Windows installer is unsigned (D-038).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to (re)build and (re)attach"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: v
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          CONF="$(sed -n 's/^  "version": "\(.*\)",$/\1/p' apps/desktop/src-tauri/tauri.conf.json)"
          [ "$CONF" = "$VERSION" ] || { echo "tauri.conf.json is $CONF but the tag is $TAG"; exit 1; }
          grep -q "^version = \"$VERSION\"" apps/desktop/src-tauri/Cargo.toml || { echo "Cargo.toml version does not match $TAG"; exit 1; }
          [ -f "docs/releases/$VERSION.md" ] || { echo "docs/releases/$VERSION.md is missing"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          case "$VERSION" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

  test:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  macos:
    needs: [verify, test]
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: bun install --frozen-lockfile
      # Import the Developer ID certificate into a throwaway keychain here
      # rather than through the Tauri CLI's APPLE_CERTIFICATE path: the CLI
      # insists the .p12 hold exactly the signing identity, while a Keychain
      # export carries every identity on the release Mac. With the keychain
      # in the search list, Tauri only needs APPLE_SIGNING_IDENTITY and
      # codesign picks the identity by name.
      - name: Configure signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "SIGNING=ad-hoc" >> "$GITHUB_ENV"
            echo "signing: ad-hoc (APPLE_CERTIFICATE / APPLE_SIGNING_IDENTITY secrets not set)"
            exit 0
          fi
          KC="$RUNNER_TEMP/signing.keychain-db"; KC_PW="$(openssl rand -hex 16)"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          rm -f "$RUNNER_TEMP/cert.p12"
          # Apple's Developer ID intermediates, so codesign can build the chain.
          for ca in DeveloperIDCA DeveloperIDG2CA; do
            curl -fsSL -o "$RUNNER_TEMP/$ca.cer" "https://www.apple.com/certificateauthority/$ca.cer"
            security import "$RUNNER_TEMP/$ca.cer" -k "$KC" -T /usr/bin/codesign >/dev/null || true
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          security find-identity -v -p codesigning "$KC" | grep -qF "$APPLE_SIGNING_IDENTITY" \
            || { echo "identity '$APPLE_SIGNING_IDENTITY' is not in the imported certificate"; exit 1; }
          for v in APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] && echo "$v=${!v}" >> "$GITHUB_ENV"
          done
          echo "SIGNING=developer-id" >> "$GITHUB_ENV"
          [ -n "$APPLE_ID" ] && echo "notarization: on" || echo "notarization: off (no APPLE_ID)"
      - name: Build the universal app + dmg
        run: TRIPLE=universal-apple-darwin ./scripts/build-app.sh
      # The arm64 runner has Rosetta: prove the Intel slice of the fat
      # sidecar actually executes (bun's "CPU lacks AVX" line is only a
      # warning there; --help exits 2 by design).
      - name: Smoke-test both sidecar slices
        run: |
          APP="apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/Corbits Personal Finance.app"
          lipo -info "$APP/Contents/MacOS/financial-interchange" "$APP/Contents/MacOS/fin-host"
          "$APP/Contents/MacOS/fin-host" --help 2>&1 | grep -q 'fin-host <init' && echo "arm64 slice: ok"
          /usr/bin/arch -x86_64 "$APP/Contents/MacOS/fin-host" --help 2>&1 | grep -q 'fin-host <init' && echo "x86_64 slice (Rosetta): ok"
          codesign --verify --strict --deep "$APP" && echo "signature: ok"
      - name: Collect artifacts
        run: |
          set -x
          OUT=release; mkdir -p "$OUT"
          DMG=$(ls apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          cp "$DMG" "$OUT/Corbits-Personal-Finance-$VERSION-macOS-universal.dmg"
          echo "$SIGNING" > "$OUT/macos-signing.txt"
          ls -la "$OUT"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: release/*
          if-no-files-found: error

  windows:
    needs: [verify, test]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: bun install --frozen-lockfile
      - name: Compile fin-host sidecar (bun-windows-x64)
        run: ./scripts/build-host.sh bun-windows-x64 apps/desktop/src-tauri/binaries/fin-host-x86_64-pc-windows-msvc.exe
      # NSIS only: the config's ["app", "dmg"] targets are the macOS
      # build. Unsigned per DECISIONS.md D-038 (SmartScreen will warn).
      - name: Tauri build (NSIS)
        working-directory: apps/desktop
        run: bunx @tauri-apps/cli@^2 build --bundles nsis
      - name: Collect artifacts
        run: |
          set -x
          OUT=release; mkdir -p "$OUT"
          EXE=$(ls apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          cp "$EXE" "$OUT/Corbits-Personal-Finance-$VERSION-Windows-x64-setup.exe"
          ls -la "$OUT"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: release/*
          if-no-files-found: error

  publish:
    needs: [verify, macos, windows]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.verify.outputs.tag }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Assemble the release directory
        shell: bash
        run: |
          set -x
          mkdir -p release
          cp artifacts/*.dmg artifacts/*.exe release/
          SIGNING="$(cat artifacts/macos-signing.txt)"
          (cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          {
            cat "docs/releases/$VERSION.md"
            echo
            echo "## Downloads"
            echo
            echo "- **macOS** (Apple silicon and Intel, one universal app): \`Corbits-Personal-Finance-$VERSION-macOS-universal.dmg\`"
            if [ "$SIGNING" = "ad-hoc" ]; then
              echo "  - *This build is ad-hoc signed (no Developer ID configured in CI). macOS will refuse to open it until you right-click → Open, or it is replaced by a notarized build.*"
            else
              echo "  - Developer ID signed and notarized."
            fi
            echo "- **Windows 10/11 x64**: \`Corbits-Personal-Finance-$VERSION-Windows-x64-setup.exe\` — unsigned; SmartScreen will warn (More info → Run anyway)."
            echo "- \`SHA256SUMS.txt\` — verify with \`shasum -a 256 -c SHA256SUMS.txt\` (macOS) or \`certutil -hashfile <file> SHA256\` (Windows)."
          } > release-notes.md
      - name: Create or update the draft release
        shell: bash
        run: |
          set -x
          PRE=""; [ "${{ needs.verify.outputs.prerelease }}" = "true" ] && PRE="--prerelease"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Corbits Personal Finance $VERSION" --notes-file release-notes.md $PRE
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" --draft $PRE --verify-tag \
              --title "Corbits Personal Finance $VERSION" --notes-file release-notes.md release/*
          fi
          gh release view "$TAG" --json url,isDraft,assets --jq '{url, isDraft, assets: [.assets[].name]}'
